<body>
<div id="app"></div>

<script>
/* =========================================================================
   Holden — Commercial | Supplier Selection  (monday.com Board View app)

   Board model (multi-level board, item terminology "Packages"):
     level 1  Package        -> group "topics" (Active) / "group_mm5zx8vr" (Closed)
     level 2  Scope/Trade    -> subitem of Package (carries Bid Specs file + Date Quote Reqd)
     level 3  Supplier Bid   -> subitem of Scope (carries Status, Bid Amount, Confidence, dates)

   Backend contract (n8n):
     - Setting a Supplier Bid's Status to "Approved to send" fires the monday
       webhook -> "Holden - RFQ Send on Approval": it walks UP the parent chain
       for the Bid Specs file, emails the RFQ, then sets Status="Sent" + RFQ Sent date.
     - "Holden - Supplier Bid Poll & Capture" polls Status="Sent" items every
       15 min, reads the newest supplier update, Gemini-extracts the price and
       writes Bid Amount, Status="Received", Date Received, Bid Capture Confidence.

   So this app only ever writes:
     - Status -> "Approved to send"  (Send RFQ)
     - Selected checkbox + Status -> "Selected"  (Award)
   Everything else is read-only and driven by the automations.
   ========================================================================= */

const COLS = {
  bidSpecs:   'file_mm5z30aq',
  supplier:   'board_relation_mm5zt5hb',
  contacts:   'lookup_mm5zne0d',
  rfqSent:    'date_mm5zwzgf',
  quoteReqd:  'date_mm6hfwrm',
  received:   'date_mm5zw9dc',
  status:     'color_mm6hhv2y',
  pkgBudget:  'lookup_mm5zhake',
  quoteFile:  'file_mm5zk3m2',
  bidAmount:  'numeric_mm5z75jd',
  selected:   'boolean_mm5zjgjm',
  confidence: 'numeric_mm5zcf3a',
};
const CLOSED_GROUP_ID = 'group_mm5zx8vr';
const DEFAULT_BOARD_ID = 5101746025;

const monday = window.mondaySdk();
try { monday.setApiVersion('2026-04'); } catch (e) {}

const TONE = {
  green:  { bg:'#e6f9f1', color:'#067a4a', accent:'#00c875' },
  orange: { bg:'#fef2e2', color:'#a8631a', accent:'#fdab3d' },
  red:    { bg:'#fbe7ea', color:'#b8324a', accent:'#e2445c' },
  blue:   { bg:'#e6f1fd', color:'#0058b8', accent:'#0073ea' },
  grey:   { bg:'#eceff5', color:'#676879', accent:'#c3c6d4' },
  gold:   { bg:'#faf3d1', color:'#8f7d13', accent:'#cab641' },
};

const state = {
  boardId: DEFAULT_BOARD_ID,
  loading: true,
  error: null,
  busy: {},            // itemId -> true while a mutation is in flight
  open: {},            // packageId -> expanded
  filter: 'Active',
  search: '',
  drawer: null,        // { pid, sid }
  pkgs: [],
  firstLoadDone: false,
};

/* ------------------------------- helpers ------------------------------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return '\u20ac' + Math.round(n).toLocaleString('en-IE'); }
function fmtShort(iso){
  if (!iso) return null;
  const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
  if (isNaN(d)) return null;
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' });
}
function parseFiles(colValue){
  if (!colValue) return [];
  try { return (JSON.parse(colValue).files || []).map(f => ({ name: f.name, assetId: f.assetId })); }
  catch (e) { return []; }
}
function colOf(item, id){ return (item.column_values || []).find(c => c.id === id) || {}; }
function textOf(item, id){ const c = colOf(item, id); return c.text || ''; }
// Status column on this board is rollup-enabled -> comes back as BatteryValue,
// not plain text. Leaf items (actual Supplier Bids) carry one battery_value
// entry representing their own status; decode its key via STATUS_LABELS.
// Falls back to plain .text for any item where it isn't a rollup value.
function statusOf(item, id){
  const c = colOf(item, id);
  if (c.battery_value && c.battery_value.length) {
    const key = Number(c.battery_value[0].key);
    return STATUS_LABELS[key] || '';
  }
  return c.text || '';
}
function displayOf(item, id){ const c = colOf(item, id); return c.display_value || c.text || ''; }
function numOf(item, id){ const t = textOf(item, id); const n = parseFloat(t); return isFinite(n) ? n : null; }
function checkedOf(item, id){
  const c = colOf(item, id);
  if (c.text === 'v') return true;
  try { return !!(c.value && JSON.parse(c.value).checked); } catch (e) { return false; }
}

/* ------------------------------ data fetch ----------------------------- */
// Confirmed on this account (API 2026-04, multi-level board): top-level
// items_page items each expose `subitems` as a FLATTENED list of ALL
// descendants (any depth), each with parent_item.id — so one scan plus a
// parent-chain rebuild recovers the full Package > Scope > Bid tree.
const COL_IDS = Object.values(COLS).map(id => '"' + id + '"').join(',');
// capabilities: [CALCULATED] is required on this multi-level board — without it,
// any rollup-enabled column (Status, RFQ Sent, Date Quote Received, ...) comes
// back as an empty array from column_values, silently, with no error. Rollup
// status columns also resolve to BatteryValue instead of StatusValue, so text
// is blank on them too; battery_value[].key must be decoded via STATUS_LABELS.
const COL_FRAG = `column_values(ids: [${COL_IDS}], capabilities: [CALCULATED]) { id text value ... on MirrorValue { display_value } ... on BoardRelationValue { display_value } ... on BatteryValue { battery_value { key count } is_leaf } }`;
// Label id -> text, copied from this board's Status column settings (same set
// on both the live "Status" and legacy "Status(Old)" columns).
const STATUS_LABELS = { 0:'Not sent', 1:'No response', 2:'Received', 3:'Sent', 4:'Partial', 6:'Selected', 7:'Confirmed', 8:'Approved to send' };

function boardQuery(boardId){
  return `query {
    boards(ids: [${boardId}]) {
      name
      items_page(limit: 100) {
        items {
          id name group { id }
          parent_item { id }
          ${COL_FRAG}
          subitems { id name parent_item { id } ${COL_FRAG} }
        }
      }
    }
  }`;
}

async function loadBoard(){
  state.loading = !state.firstLoadDone;
  state.error = null;
  render();
  try {
    const res = await monday.api(boardQuery(state.boardId));
    const board = (((res || {}).data || {}).boards || [])[0];
    if (!board) throw new Error('Board ' + state.boardId + ' not returned — check that the app has boards:read scope and access to this board.');
    state.pkgs = buildTree(board);
    state.firstLoadDone = true;
    // default: expand first active package on first load
    if (Object.keys(state.open).length === 0 && state.pkgs.length) state.open[state.pkgs[0].id] = true;
  } catch (e) {
    state.error = (e && e.message) ? e.message : 'Could not load the board.';
  }
  state.loading = false;
  render();
}

function buildTree(board){
  const tops = (board.items_page && board.items_page.items) || [];
  const byId = {};
  const childrenOf = {};
  tops.forEach(it => {
    byId[it.id] = it;
    (it.subitems || []).forEach(sub => { byId[sub.id] = sub; });
  });
  Object.values(byId).forEach(it => {
    const pid = it.parent_item ? String(it.parent_item.id) : null;
    if (pid) (childrenOf[pid] = childrenOf[pid] || []).push(it);
  });

  return tops.filter(it => !it.parent_item).map((p, i) => {
    const scopes = (childrenOf[p.id] || []).map(sc => {
      const bids = (childrenOf[sc.id] || []).map(b => bidModel(b));
      return {
        id: String(sc.id),
        name: sc.name,
        due: textOf(sc, COLS.quoteReqd) || null,
        specs: parseFiles(colOf(sc, COLS.bidSpecs).value),
        bids,
      };
    });
    const mirrorBudget = parseFloat(String(displayOf(p, COLS.pkgBudget)).replace(/[^0-9.\-]/g, ''));
    const budget = isFinite(mirrorBudget) && mirrorBudget > 0 ? mirrorBudget : numOf(p, COLS.bidAmount);
    return {
      id: String(p.id),
      code: 'PKG-' + String(i + 1).padStart(2, '0'),
      name: p.name,
      closed: !!(p.group && p.group.id === CLOSED_GROUP_ID),
      budget: budget,
      scopes,
    };
  });
}

function bidModel(b){
  const status = statusOf(b, COLS.status) || 'Not sent';
  const conf = numOf(b, COLS.confidence);
  const won = checkedOf(b, COLS.selected) || status === 'Selected' || status === 'Confirmed';
  const supplier = displayOf(b, COLS.supplier) || b.name;
  const contact = displayOf(b, COLS.contacts);
  return {
    id: String(b.id),
    supplier, contact,
    amount: numOf(b, COLS.bidAmount),
    conf: conf,
    receivedOn: textOf(b, COLS.received) || null,
    sentOn: textOf(b, COLS.rfqSent) || null,
    rawStatus: status,
    received: status === 'Received' || status === 'Selected' || status === 'Confirmed' || (numOf(b, COLS.bidAmount) != null && status !== 'Not sent'),
    pending: status === 'Sent' || status === 'Approved to send',
    notSent: status === 'Not sent' || status === '',
    won,
  };
}

/* ------------------------------ mutations ------------------------------ */
async function changeCols(itemId, columnValues){
  const cv = JSON.stringify(JSON.stringify(columnValues));
  const q = `mutation { change_multiple_column_values(board_id: ${state.boardId}, item_id: ${itemId}, column_values: ${cv}, create_labels_if_missing: false) { id } }`;
  return monday.api(q);
}

async function confirmBox(message){
  try {
    const r = await monday.execute('confirm', { message, confirmButton: 'Confirm', cancelButton: 'Cancel' });
    return r && r.data && r.data.confirm;
  } catch (e) { return window.confirm(message); }
}
function toast(message, type){
  try { monday.execute('notice', { message, type: type || 'success', timeout: 4000 }); } catch (e) {}
}

// Send RFQ = flip every not-yet-sent Supplier Bid under this scope to
// "Approved to send" on both status columns — the n8n webhook does the rest
// (email + Status="Sent") once automation picks it up.
async function sendRfq(pkg, scope){
  const targets = scope.bids.filter(b => b.notSent);
  if (!targets.length) return;
  if (!scope.specs.length) { toast('Attach bid specs to "' + scope.name + '" before sending.', 'error'); return; }
  const ok = await confirmBox('Send RFQ to ' + targets.length + ' supplier' + (targets.length === 1 ? '' : 's') + ' for "' + scope.name + '"? The RFQ email is sent automatically with the attached bid specs.');
  if (!ok) return;
  state.busy[scope.id] = true; render();
  try {
    for (const b of targets) await changeCols(b.id, { [COLS.status]: { label: 'Approved to send' }, 'color_mm71fab2': { label: 'Approved to send' } });
    toast('RFQ approved to send for ' + targets.length + ' supplier' + (targets.length === 1 ? '' : 's') + '.');
  } catch (e) { toast('Send failed: ' + (e.message || e), 'error'); }
  delete state.busy[scope.id];
  await loadBoard();
}

async function award(pkg, scope, bid){
  const ok = await confirmBox('Award "' + scope.name + '" to ' + bid.supplier + ' for ' + (bid.amount != null ? money(bid.amount) : 'the quoted amount') + '?');
  if (!ok) return;
  state.busy[bid.id] = true; render();
  try {
    await changeCols(bid.id, { [COLS.selected]: { checked: 'true' }, [COLS.status]: { label: 'Selected' } });
    for (const other of scope.bids.filter(b => b.id !== bid.id && b.won)) {
      await changeCols(other.id, { [COLS.selected]: { checked: 'false' } });
    }
    toast('Awarded to ' + bid.supplier + '.');
    state.drawer = null;
  } catch (e) { toast('Award failed: ' + (e.message || e), 'error'); }
  delete state.busy[bid.id];
  await loadBoard();
}

// File columns can't be written from a board-view iframe without a raised
// token, so attaching specs opens the scope's item card on the Files column.
function attachSpec(scope){
  monday.execute('openItemCard', { itemId: Number(scope.id) });
  toast('Attach the bid spec to the "Bid Specs" column, then refresh.', 'info');
}
function openItem(id){ monday.execute('openItemCard', { itemId: Number(id) }); }

/* ------------------------------ view model ----------------------------- */
function scopeState(sc){
  const rec = sc.bids.filter(b => b.received);
  const won = sc.bids.find(b => b.won);
  if (won) return { status:'Awarded', tone:'green' };
  if (!sc.bids.length) return { status:'No suppliers', tone:'grey' };
  if (sc.bids.every(b => b.notSent)) return { status:'Not sent', tone:'grey' };
  if (!rec.length) return { status:'Awaiting bids', tone:'blue' };
  if (rec.length < sc.bids.length) return { status:'Partial', tone:'orange' };
  return { status:'Ready to award', tone:'orange' };
}

function bidStatusView(b){
  if (b.won) return { label:'Awarded', tone:'green' };
  if (b.received) return { label:'Bid received', tone:'blue' };
  if (b.rawStatus === 'Approved to send') return { label:'Approved to send', tone:'gold' };
  if (b.rawStatus === 'Sent') return { label:'RFQ sent', tone:'grey' };
  if (b.rawStatus === 'No response') return { label:'No response', tone:'orange' };
  return { label:'Not sent', tone:'grey' };
}

function render(){
  const root = document.getElementById('app');

  if (s.loading && !s.firstLoadDone) {
    root.innerHTML = '<div style="min-height:60vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; color:#9699a6">'
      + '<div style="width:26px; height:26px; border:3px solid #e6e9ef; border-top-color:#0073ea; border-radius:50%; animation:spin .8s linear infinite"></div>'
      + '<span style="font-size:12.5px">Loading packages\u2026</span></div>';
    return;
  }
  if (s.error) {
    root.innerHTML = '<div style="max-width:640px; margin:60px auto; padding:20px; background:#fff; border:1px solid #e6e9ef; border-radius:10px">'
      + '<h3 style="margin:0 0 6px; font-size:15px; color:#b8324a">Could not load the board</h3>'
      + '<p style="margin:0 0 14px; font-size:12.5px; color:#676879; line-height:1.5">' + esc(s.error) + '</p>'
      + '<button onclick="loadBoard()" style="height:32px; padding:0 14px; border-radius:6px; border:none; background:#0073ea; color:#fff; font-size:12.5px; font-weight:600; cursor:pointer">Try again</button></div>';
    return;
  }

  const q = s.search.trim().toLowerCase();
  let awaiting = 0;
  s.pkgs.forEach(p => p.scopes.forEach(sc => sc.bids.forEach(b => { if (b.received && !b.won && !sc.bids.some(x => x.won)) awaiting++; })));

  const match = p => !q || p.code.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)
    || p.scopes.some(sc => sc.name.toLowerCase().includes(q) || sc.bids.some(b => (b.supplier || '').toLowerCase().includes(q)));

  const visible = s.pkgs.filter(p => {
    if (s.filter === 'Active' && p.closed) return false;
    if (s.filter === 'Closed' && !p.closed) return false;
    if (s.filter === 'Needs decision') {
      const has = p.scopes.some(sc => sc.bids.some(b => b.received && !b.won) && !sc.bids.some(b => b.won));
      if (!has) return false;
    }
    return match(p);
  });

  const filters = ['Active','Needs decision','Closed','All'].map(f => {
    const on = f === s.filter;
    return '<button class="flt" data-filter="' + esc(f) + '" style="padding:5px 11px; border-radius:999px; border:1px solid ' + (on ? '#323338' : '#e6e9ef') + '; background:' + (on ? '#323338' : '#fff') + '; color:' + (on ? '#ffffff' : '#676879') + '; font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap; flex-shrink:0">' + esc(f) + '</button>';
  }).join('');

  const cards = visible.map(p => packageCard(p)).join('');

  root.innerHTML =
  '<div style="min-height:100vh; background:#f6f7fb; padding-bottom:56px">'
  + '<div style="max-width:1400px; margin:0 auto; padding:20px 24px 0">'
    + '<div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 2px 10px; flex-wrap:wrap">'
      + '<div style="display:flex; align-items:baseline; gap:10px">'
        + '<span style="font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:#676879">Packages</span>'
        + '<span style="font-size:11.5px; color:#9699a6">' + visible.length + ' shown \u00b7 ' + awaiting + ' bids awaiting decision</span>'
      + '</div>'
      + '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">'
        + '<div style="display:flex; gap:6px; flex-wrap:wrap">' + filters + '</div>'
        + '<input id="searchBox" class="search" value="' + esc(s.search) + '" placeholder="Search packages, scopes, suppliers" style="height:30px; width:250px; padding:0 11px; border:1px solid #e6e9ef; border-radius:6px; background:#fff; color:#323338; font-size:12.5px" />'
        + '<button id="refreshBtn" class="flt" title="Refresh" style="height:30px; padding:0 11px; border-radius:6px; border:1px solid #e6e9ef; background:#fff; color:#676879; font-size:11.5px; font-weight:600; cursor:pointer">' + (s.loading ? 'Refreshing\u2026' : '\u21bb Refresh') + '</button>'
      + '</div>'
    + '</div>'
    + '<div style="display:flex; flex-direction:column; gap:12px; margin-bottom:22px">' + cards + '</div>'
    + (visible.length === 0 ? '<p style="margin:0 2px; font-size:12.5px; color:#9699a6">No packages match this view.</p>' : '')
  + '</div>'
  + drawerHtml()
  + '<div style="position:fixed; left:8px; bottom:6px; z-index:50; font-size:10px; color:#c3c6d4; font-family:monospace">' + DEBUG_BUILD + '</div>'
  + '</div>';

  wireEvents();
}

function packageCard(p){
  const s = state;
  const collapsed = !s.open[p.id];
  let inv = 0, rec = 0, lowSum = 0, covered = 0, nextDue = null;

  const scopeRows = p.scopes.map(sc => {
    inv += sc.bids.length;
    const got = sc.bids.filter(b => b.received && b.amount != null);
    rec += sc.bids.filter(b => b.received).length;
    const won = sc.bids.find(b => b.won);
    const low = got.length ? Math.min.apply(null, got.map(b => b.amount)) : null;
    if (won && won.amount != null) { lowSum += won.amount; covered++; }
    else if (low != null) { lowSum += low; covered++; }
    if (sc.due && (nextDue == null || sc.due < nextDue)) nextDue = sc.due;

    const st = scopeState(sc);
    const t = TONE[st.tone];
    const notSentBids = sc.bids.filter(b => b.notSent);
    const canSend = notSentBids.length > 0 && !sc.bids.some(b => b.won);
    const noBids = sc.bids.length === 0;
    const specs = sc.specs || [];
    const busy = !!s.busy[sc.id];

    const specChips = (canSend || noBids)
      ? '<div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:6px">'
        + specs.map(sp => '<span style="display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:5px; background:#eceff5; color:#676879; font-size:11px; font-weight:600; white-space:nowrap">\ud83d\udcce ' + esc(sp.name) + '</span>').join('')
        + '<button class="attach-btn" data-attach="' + p.id + '|' + sc.id + '" style="padding:3px 9px; border-radius:5px; border:1px dashed #d0d4e4; background:transparent; color:#676879; font-size:11px; font-weight:600; cursor:pointer; white-space:nowrap">+ Attach bid specs</button>'
        + (specs.length === 0 ? '<span style="font-size:11px; font-weight:600; color:#a8631a; white-space:nowrap">Specs required before sending</span>' : '')
      + '</div>' : '';

    let btnLabel, btnBg, btnColor, btnBorder, btnAction;
    if (noBids) {
      btnLabel = 'Add suppliers'; btnBg = '#fff'; btnColor = '#323338'; btnBorder = '#d0d4e4'; btnAction = 'open|' + sc.id;
    } else if (canSend) {
      const ready = specs.length > 0;
      btnLabel = busy ? 'Sending\u2026' : 'Send RFQ' + (notSentBids.length < sc.bids.length ? ' (' + notSentBids.length + ')' : '');
      btnBg = ready ? '#0073ea' : '#f6f7fb'; btnColor = ready ? '#fff' : '#9699a6'; btnBorder = ready ? '#0073ea' : '#e6e9ef';
      btnAction = ready ? ('send|' + p.id + '|' + sc.id) : ('attach|' + p.id + '|' + sc.id);
    } else {
      const wonB = sc.bids.some(b => b.won);
      btnLabel = wonB ? 'View bids' : 'Compare bids';
      btnBg = wonB ? '#fff' : '#0073ea'; btnColor = wonB ? '#323338' : '#fff'; btnBorder = wonB ? '#d0d4e4' : '#0073ea';
      btnAction = 'drawer|' + p.id + '|' + sc.id;
    }

    const meta = sc.bids.length
      ? (sc.bids.filter(b => b.received).length + ' of ' + sc.bids.length + ' bids in \u00b7 ' + (won ? 'awarded to ' + esc(won.supplier) : 'no award yet'))
      : 'No suppliers invited \u00b7 ' + (specs.length ? specs.length + ' spec' + (specs.length === 1 ? '' : 's') + ' attached' : 'no specs attached');

    return '<div style="display:grid; grid-template-columns:minmax(0,1fr) 125px 90px 100px 140px; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid #f0f2f7">'
      + '<div style="min-width:0">'
        + '<span style="display:block; font-size:13px; font-weight:600; color:#323338">' + esc(sc.name) + '</span>'
        + '<span style="display:block; margin-top:2px; font-size:11.5px; color:#9699a6">' + meta + '</span>'
        + specChips
      + '</div>'
      + '<span style="justify-self:start; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; background:' + t.bg + '; color:' + t.color + '">' + st.status + '</span>'
      + '<span style="font-size:12px; color:#676879; font-variant-numeric:tabular-nums">' + (fmtShort(sc.due) || '\u2014') + '</span>'
      + '<span style="text-align:right; font-size:13px; font-weight:600; color:#323338; font-variant-numeric:tabular-nums">' + (won && won.amount != null ? money(won.amount) : (low != null ? money(low) : '\u2014')) + '</span>'
      + '<div style="text-align:right"><button class="act-btn" data-action="' + btnAction + '" ' + (busy ? 'disabled' : '') + ' style="height:28px; padding:0 12px; border-radius:6px; border:1px solid ' + btnBorder + '; background:' + btnBg + '; color:' + btnColor + '; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap">' + btnLabel + '</button></div>'
    + '</div>';
  }).join('');

  const done = p.scopes.length > 0 && p.scopes.every(sc => sc.bids.some(b => b.won));
  const decidable = p.scopes.some(sc => sc.bids.some(b => b.received && !b.won) && !sc.bids.some(b => b.won));
  const st = done ? { l:'Awarded', t:'green' } : decidable ? { l:'Needs decision', t:'orange' } : inv ? { l:'Awaiting bids', t:'blue' } : { l:'Not sent', t:'grey' };
  const fullyPriced = covered === p.scopes.length && p.scopes.length > 0;
  const variance = fullyPriced && p.budget != null ? lowSum - p.budget : null;

  return '<div style="background:#fff; border:1px solid #e6e9ef; border-radius:10px; box-shadow:0 1px 2px rgba(0,0,0,.04); overflow:hidden">'
    + '<div class="pkg-head" data-toggle="' + p.id + '" style="display:grid; grid-template-columns:16px minmax(0,1fr) 120px 110px 120px 70px; gap:12px; align-items:center; padding:14px 18px; cursor:pointer">'
      + '<span style="color:#9699a6; font-size:11px; font-weight:700">' + (collapsed ? '\u25B8' : '\u25BE') + '</span>'
      + '<div style="min-width:0">'
        + '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">'
          + '<span style="font-size:11px; font-weight:700; color:#9699a6; font-variant-numeric:tabular-nums">' + p.code + '</span>'
          + '<span style="font-size:14.5px; font-weight:600; color:#323338">' + esc(p.name) + '</span>'
          + '<span style="padding:2px 8px; border-radius:5px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; background:' + TONE[st.t].bg + '; color:' + TONE[st.t].color + '">' + st.l + '</span>'
        + '</div>'
        + '<span style="display:block; margin-top:3px; font-size:11.5px; color:#9699a6">' + p.scopes.length + ' scopes \u00b7 ' + inv + ' suppliers invited</span>'
      + '</div>'
      + '<div>'
        + '<div style="display:flex; justify-content:space-between; font-size:11px; color:#9699a6; margin-bottom:4px"><span>Bids in</span><span style="font-variant-numeric:tabular-nums">' + rec + '/' + inv + '</span></div>'
        + '<div style="height:6px; border-radius:3px; background:#eceff5; overflow:hidden"><div style="height:100%; width:' + (inv ? Math.round(rec / inv * 100) : 0) + '%; background:' + (done ? TONE.green.accent : TONE.blue.accent) + '"></div></div>'
      + '</div>'
      + '<div style="text-align:right">'
        + '<div style="font-size:13.5px; font-weight:700; color:#323338; font-variant-numeric:tabular-nums">' + (p.budget != null ? money(p.budget) : '\u2014') + '</div>'
        + '<div style="font-size:11px; color:#9699a6">budget</div>'
      + '</div>'
      + '<div style="text-align:right">'
        + '<div style="font-size:13.5px; font-weight:700; color:' + (variance == null ? '#9699a6' : (variance <= 0 ? '#067a4a' : '#b8324a')) + '; font-variant-numeric:tabular-nums">' + (covered ? money(lowSum) : '\u2014') + '</div>'
        + '<div style="font-size:11px; color:#9699a6">' + (variance == null
            ? (covered ? 'partial \u2014 ' + covered + ' of ' + p.scopes.length + ' priced' : 'no bids yet')
            : (variance <= 0 ? money(Math.abs(variance)) + ' under' : money(variance) + ' over')) + '</div>'
      + '</div>'
      + '<div style="text-align:right; font-size:11.5px; color:#9699a6; font-variant-numeric:tabular-nums">' + (fmtShort(nextDue) || '\u2014') + '</div>'
    + '</div>'
    + (collapsed ? '' : '<div style="border-top:1px solid #f0f2f7; background:#fafbfd; padding:4px 18px 12px">' + scopeRows + '</div>')
  + '</div>';
}

function drawerHtml(){
  const s = state;
  if (!s.drawer) return '';
  const p = s.pkgs.find(x => x.id === s.drawer.pid);
  const sc = p && p.scopes.find(x => x.id === s.drawer.sid);
  if (!p || !sc) return '';

  const got = sc.bids.filter(b => b.received && b.amount != null);
  const low = got.length ? Math.min.apply(null, got.map(b => b.amount)) : null;
  const sorted = sc.bids.slice().sort((a, b) => (a.amount == null) - (b.amount == null) || (a.amount - b.amount));

  const cards = sorted.map(b => {
    const flag = b.received && b.conf != null && b.conf < 75;
    const delta = b.amount != null && low != null ? b.amount - low : null;
    const ct = b.conf == null ? TONE.grey : (flag ? TONE.orange : TONE.green);
    const sv = bidStatusView(b);
    const stTone = TONE[sv.tone];
    const busy = !!s.busy[b.id];
    return '<div style="border:1px solid ' + (b.won ? '#00c875' : '#e6e9ef') + '; border-radius:10px; background:' + (b.won ? '#f4fdf9' : '#fff') + '; padding:14px 16px">'
      + '<div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px">'
        + '<div style="min-width:0">'
          + '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">'
            + '<span style="font-size:14px; font-weight:700; color:#323338">' + esc(b.supplier) + '</span>'
            + (b.won ? '<span style="padding:2px 8px; border-radius:5px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; background:#e6f9f1; color:#067a4a">Awarded</span>' : '')
          + '</div>'
          + '<span style="display:block; margin-top:2px; font-size:11.5px; color:#9699a6">' + esc(b.contact || '') + '</span>'
        + '</div>'
        + '<div style="text-align:right; flex-shrink:0">'
          + '<div style="font-size:20px; font-weight:700; color:#323338; font-variant-numeric:tabular-nums">' + (b.amount != null ? money(b.amount) : 'No bid yet') + '</div>'
          + '<div style="font-size:11px; font-weight:600; color:' + (delta === 0 ? '#067a4a' : '#9699a6') + '; font-variant-numeric:tabular-nums">' + (delta == null ? '' : (delta === 0 ? 'lowest bid' : '+' + money(delta) + ' vs lowest')) + '</div>'
        + '</div>'
      + '</div>'
      + '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:11px">'
        + '<span style="padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; background:' + stTone.bg + '; color:' + stTone.color + '">' + sv.label + '</span>'
        + (b.conf != null ? '<span style="display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700; background:' + ct.bg + '; color:' + ct.color + '">' + Math.round(b.conf) + '% capture confidence</span>' : '')
        + '<span style="font-size:11.5px; color:#9699a6; font-variant-numeric:tabular-nums">' + (b.receivedOn ? 'received ' + fmtShort(b.receivedOn) : 'awaiting response') + '</span>'
      + '</div>'
      + (flag ? '<div style="margin-top:10px; padding:9px 11px; border-radius:8px; background:#fef2e2; font-size:12px; line-height:1.5; color:#a8631a">Low confidence \u2014 the AI could not read the quote cleanly. Check the total and inclusions against the original PDF before awarding.</div>' : '')
      + ((b.received && !b.won) ? '<button class="award-btn" data-award="' + p.id + '|' + sc.id + '|' + b.id + '" ' + (busy ? 'disabled' : '') + ' style="margin-top:12px; width:100%; height:32px; border:none; border-radius:6px; background:#0073ea; color:#fff; font-size:12.5px; font-weight:600; cursor:pointer">' + (busy ? 'Awarding\u2026' : 'Award to ' + esc(b.supplier)) + '</button>' : '')
    + '</div>';
  }).join('');

  return '<div id="drawerOverlay" style="position:fixed; inset:0; z-index:19; background:rgba(0,0,0,.32)"></div>'
    + '<div style="position:fixed; top:0; right:0; bottom:0; width:560px; max-width:94vw; z-index:20; background:#fff; border-left:1px solid #e6e9ef; box-shadow:-8px 0 24px rgba(0,0,0,.08); display:flex; flex-direction:column">'
      + '<div style="padding:16px 20px; border-bottom:1px solid #e6e9ef; display:flex; align-items:flex-start; justify-content:space-between; gap:12px">'
        + '<div style="min-width:0">'
          + '<span style="display:block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#9699a6">' + p.code + ' \u00b7 ' + esc(p.name) + '</span>'
          + '<h3 style="margin:3px 0 0; font-size:16px; font-weight:700; color:#323338">' + esc(sc.name) + '</h3>'

        + '<button id="drawerClose" class="x-btn" style="width:28px; height:28px; border:none; border-radius:6px; background:transparent; color:#676879; font-size:13px; cursor:pointer; flex-shrink:0">\u2715</button>'
      + '</div>'
      + '<div style="padding:16px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; flex:1">' + cards + '</div>'
    + '</div>';
}

/* -------------------------------- events ------------------------------- */
function wireEvents(){
  document.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => {
    const id = el.getAttribute('data-toggle');
    state.open[id] = !state.open[id];
    render();
  }));
  document.querySelectorAll('[data-filter]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation(); state.filter = el.getAttribute('data-filter'); render();
  }));
  const sb = document.getElementById('searchBox');
  if (sb) sb.addEventListener('input', () => {
    state.search = sb.value;
    clearTimeout(sb._t);
    sb._t = setTimeout(() => { const pos = sb.selectionStart; render(); const n = document.getElementById('searchBox'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250);
  });
  const rb = document.getElementById('refreshBtn');
  if (rb) rb.addEventListener('click', e => { e.stopPropagation(); loadBoard(); });

  document.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const parts = el.getAttribute('data-action').split('|');
    const kind = parts[0];
    if (kind === 'open') { openItem(parts[1]); return; }
    const p = state.pkgs.find(x => x.id === parts[1]);
    const sc = p && p.scopes.find(x => x.id === parts[2]);
    if (!p || !sc) return;
    if (kind === 'send') sendRfq(p, sc);
    else if (kind === 'attach') attachSpec(sc);
    else if (kind === 'drawer') { state.drawer = { pid: p.id, sid: sc.id }; render(); }
  }));
  document.querySelectorAll('[data-attach]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const [pid, sid] = el.getAttribute('data-attach').split('|');
    const p = state.pkgs.find(x => x.id === pid);
    const sc = p && p.scopes.find(x => x.id === sid);
    if (sc) attachSpec(sc);
  }));
  document.querySelectorAll('[data-award]').forEach(el => el.addEventListener('click', () => {
    const [pid, sid, bidId] = el.getAttribute('data-award').split('|');
    const p = state.pkgs.find(x => x.id === pid);
    const sc = p && p.scopes.find(x => x.id === sid);
    const b = sc && sc.bids.find(x => x.id === bidId);
    if (b) award(p, sc, b);
  }));
  const ov = document.getElementById('drawerOverlay');
  if (ov) ov.addEventListener('click', () => { state.drawer = null; render(); });
  const dc = document.getElementById('drawerClose');
  if (dc) dc.addEventListener('click', () => { state.drawer = null; render(); });
}

/* --------------------------------- boot -------------------------------- */
monday.listen('context', res => {
  const ctx = (res && res.data) || {};
  const bid = ctx.boardId || (ctx.boardIds && ctx.boardIds[0]);
  if (bid && Number(bid) !== Number(state.boardId)) { state.boardId = Number(bid); loadBoard(); }
});
// events: re-pull when the board changes (n8n writes land live)
try { monday.listen('events', () => loadBoard()); } catch (e) {}
setInterval(() => { if (!document.hidden && !state.drawer) loadBoard(); }, 60000);
loadBoard();
</script>
